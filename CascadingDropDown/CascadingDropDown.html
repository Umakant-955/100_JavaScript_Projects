<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cascading drop down</title>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
   <style>
    div{
        margin-top: 50px;
    }
    select{
        width: 150px;
        border-radius: 5px;
        padding: 2px;
    }
   </style>
   <script>
        var categories=["Select category","Footwears", "Electronics","Clothes",];
        var Footwears=["Select footwear","Men's footwears","Women's footwears","Kids footwears"];
        var Electronics=["Select electronics","Mobile","TV","Laptop"];
        var Clothes=["Select clothes", "Men's clothes","Women's clothes","Kids clothes"];

        var Products=[];
        
        function loadCategory(){
            for(var item of categories){
                var option=document.createElement("option");
                option.text=item;
                option.value=item;
                document.getElementById("lstCategory").appendChild(option);
            }
        }
        
        function bodyLoad(){
            loadCategory();
        }
        function loadProduct(){
            document.getElementById("lstProduct").innerHTML=""
            for(var item of Products){
                var option=document.createElement("option");
                option.text=item;
                option.value=item;
                document.getElementById("lstProduct").appendChild(option);
            }
        }
        function categoryChange(){
            var category=document.getElementById("lstCategory").value;
            switch(category){
                case "Footwears":
                Products=Footwears;  
                loadProduct();
                break;
                case "Electronics":
                Products=Electronics;   
                loadProduct();
                break;
                case "Clothes":
                Products=Clothes;   
                loadProduct();
                break;
                default :
                Products=["Select a product"];
                break;
            }
        }

        var Brands1=["Select brands","Nike","Puma","Addidas"]
        var Brands2=["Select brands","Samsung","Apple","Dell"];
        var Brands3=["Select brands","Wrogn", "US Polo","Zudio"];
        var Brands=[];

        function LoadBrands(){
            document.getElementById("lstBrand").innerHTML="";
            for (var item of Brands){
                var option=document.createElement("option");
                option.text=item;
                option.value=item;
                document.getElementById("lstBrand").appendChild(option);
            }
        }
        function BrandsChange(){
            var item=document.getElementById("lstProduct").value;
            switch(item){
                case "Men's footwears":
                case "Women's footwears":
                case "Kids footwears":
                Brands=Brands1
                LoadBrands();
                break;
                case "Mobile":
                case "TV":
                case "Laptop":
                Brands=Brands2
                LoadBrands();
                break;
                case "Men's clothes":
                case "Women's clothes":
                case "Kids clothes":
                Brands=Brands3
                LoadBrands();
                break;
                default:
                Brands=["Select brands"];
                break;
            }
        }
    </script>
</head>
<body onload="bodyLoad()" class="container-fluid">
    <h2>Find your product</h2>
    <div>
        <!-- Categories section-->
        <div>
            <select onchange="categoryChange()" class="form-select" id="lstCategory"></select>
        </div>
        <!-- Products section -->
        <div>
            <select onchange="BrandsChange()" class="form-select" id="lstProduct"></select>
        </div>
        <!-- Brands section -->
        <div>
            <select class="form-select" id="lstBrand"></select>
        </div>
    </div>
</body>
</html>
